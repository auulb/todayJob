name: opencode

# 触发规则（第 3 层防护，见下方 if）：
# 1) 只有仓库所有者本人（auulb）能触发，其他人（含协作者、陌生人）全部忽略
# 2) 评论必须以 /oc 或 /opencode 开头，写在句子中间不触发
#    用 startsWith 而非 contains：OpenCode 的回复里会出现 `.github/workflows/opencode.yml`
#    这种路径（含 "/opencode"），用 contains 会导致自我触发死循环
# 3) 忽略机器人评论、忽略带 Actions 运行链接的评论

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  opencode:
    if: |
      github.event.comment.user.login == github.repository_owner &&
      github.event.comment.user.type != 'Bot' &&
      !contains(github.event.comment.body, '/actions/runs/') &&
      (
        startsWith(github.event.comment.body, '/oc') ||
        startsWith(github.event.comment.body, '/opencode')
      )
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Run OpenCode
        uses: anomalyco/opencode/github@latest
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.OPENCODE_PAT }}
        with:
          model: deepseek/deepseek-flash
          use_github_token: true
          mentions: "/opencode,/oc"
