name: collect

on:
  schedule:
    # 09:00 UTC = 17:00 Asia/Shanghai
    - cron: '0 9 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: 'Target date in Asia/Shanghai (YYYY-MM-DD). Leave empty for today.'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: todayjob-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
          # A PAT is optional. With it, the push also triggers the deploy workflow's
          # push event; without it, deploy.yml is still triggered by workflow_run.
          token: ${{ secrets.TODAYJOB_PAT || github.token }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Collect jobs and write today's post
        id: collect
        env:
          TZ: Asia/Shanghai
          TODAYJOB_DATE: ${{ github.event.inputs.date }}
          TODAYJOB_ENV_FILE: collect.env
          # Optional: Secrets override collect.env without committing private sets.
          TODAYJOB_CITIES: ${{ secrets.TODAYJOB_CITIES }}
          TODAYJOB_JOBS: ${{ secrets.TODAYJOB_JOBS }}
          TODAYJOB_LIMITS: ${{ secrets.TODAYJOB_LIMITS }}
          TODAYJOB_STATUS_FILE: ${{ runner.temp }}/todayjob-status.json
          ZHAOPIN_COOKIE: ${{ secrets.ZHAOPIN_COOKIE }}
        run: node scripts/collect.mjs

      - name: Check collection status
        id: status
        if: steps.collect.outcome == 'success'
        run: |
          set -euo pipefail
          file="$RUNNER_TEMP/todayjob-status.json"
          echo "mode=$(jq -r '.mode // "unknown"' "$file")" >> "$GITHUB_OUTPUT"
          echo "cookie_status=$(jq -r '.cookieStatus // "unknown"' "$file")" >> "$GITHUB_OUTPUT"
          echo "cookie_reason=$(jq -r '.cookieFallbackReason // ""' "$file")" >> "$GITHUB_OUTPUT"
          echo "requests=$(jq -r '.requests // 0' "$file")" >> "$GITHUB_OUTPUT"
          echo "request_limit=$(jq -r '.requestLimit // 0' "$file")" >> "$GITHUB_OUTPUT"
          echo "targets=$(jq -r '.targets | length' "$file")" >> "$GITHUB_OUTPUT"
          if [ "$(jq -r '.budgetExhausted // false' "$file")" = "true" ]; then
            echo "::warning::Collection stopped at the request budget; the report may be partial."
          fi

      - name: Email cookie expiry alert
        if: steps.status.outputs.cookie_status == 'expired' || steps.status.outputs.cookie_status == 'invalid'
        continue-on-error: true
        env:
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO || secrets.SMTP_USERNAME }}
          TODAYJOB_STATUS_FILE: ${{ runner.temp }}/todayjob-status.json
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REPO: ${{ github.repository }}
          ALERT_COOLDOWN_DAYS: '3'
        run: python3 scripts/send-cookie-alert.py

      - name: Commit and push to main
        env:
          TZ: Asia/Shanghai
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add content/post
          if [ -f .todayjob/cookie-alert.json ]; then
            git add .todayjob/cookie-alert.json
          fi
          if git diff --cached --quiet; then
            echo "No new daily post to commit."
            exit 0
          fi

          git commit -m "chore: publish $(date +%F) job reports"
          git push origin HEAD:main
