name: deploy

on:
  schedule:
    # 09:30 UTC = 17:30 Asia/Shanghai
    # Collection runs at 16:30 (trending) and 17:00 (jobs); deploy once at 17:30
    # so a collection commit does not trigger its own deployment.
    - cron: '30 9 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: todayjob-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      # The 17:00 job collection can occasionally run long. Wait for the
      # scheduled collectors to finish so this build sees their commits.
      - name: Wait for scheduled collectors
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 1200))
          while :; do
            collect=$(gh run list --workflow=collect.yml --status=in_progress --limit 5 --json databaseId --jq 'length')
            trending=$(gh run list --workflow=trending.yml --status=in_progress --limit 5 --json databaseId --jq 'length')
            if [ "$collect" = "0" ] && [ "$trending" = "0" ]; then
              echo "Collectors are idle; deploying the latest main."
              break
            fi
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::warning::Collectors are still running after 20 minutes; deploying the current main."
              break
            fi
            echo "Waiting for collectors (collect=$collect, trending=$trending)..."
            sleep 30
          done

      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main
          submodules: recursive
          fetch-depth: 0

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.168.0'
          extended: true

      - name: Build site
        env:
          BASE_URL: ${{ vars.TODAYJOB_BASE_URL || 'https://todayjob.vercel.app/' }}
        run: hugo --gc --minify --baseURL "$BASE_URL"

      - name: Publish to gh-page
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-page
          publish_dir: ./public
          force_orphan: true
          user_name: 'github-actions[bot]'
          user_email: '41898282+github-actions[bot]@users.noreply.github.com'
          commit_message: 'deploy: ${{ github.sha }}'
