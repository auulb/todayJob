name: deploy

on:
  push:
    branches: [main]
  workflow_run:
    workflows: ["collect"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: todayjob-deploy
  cancel-in-progress: true

jobs:
  deploy:
    # A failed collection should not publish a partial or stale page.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main
          submodules: recursive
          fetch-depth: 0

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.168.0'
          extended: true

      - name: Build site
        env:
          BASE_URL: ${{ vars.TODAYJOB_BASE_URL || 'https://todayjob.vercel.app/' }}
        run: hugo --gc --minify --baseURL "$BASE_URL"

      - name: Publish to gh-page
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-page
          publish_dir: ./public
          force_orphan: true
          user_name: 'github-actions[bot]'
          user_email: '41898282+github-actions[bot]@users.noreply.github.com'
          commit_message: 'deploy: ${{ github.sha }}'
