mainSections   = ["post"]
rssFullContent = true
favicon        = "img/avatar.svg"

[footer]
    since = 2026
    customText = "TodayJob · 厦门开发岗位日报"

[sidebar]
    emoji    = "💼"
    subtitle = "记录厦门每天发布的开发岗位"
    avatar   = "img/avatar.svg"

[article]
    [article.license]
        enabled = false

[widgets]
    homepage = [
        { type = "search" },
        { type = "archives", params = { limit = 5 } },
        { type = "categories", params = { limit = 10 } },
        { type = "tag-cloud", params = { limit = 10 } },
    ]
    page = [
        { type = "search" },
        { type = "toc" },
    ]

[comments]
    enabled = false

[cookies]
    enabled = false
