mainSections   = ["post"]
rssFullContent = true
favicon        = "img/avatar.svg"

[footer]
    since = 2026
    customText = "TodayJob · 厦门开发岗位日报"

[sidebar]
    emoji    = "💼"
    subtitle = "记录厦门每天发布的开发岗位"
    avatar   = "img/avatar.svg"

[article]
    [article.license]
        enabled = false

[widgets]
    homepage = [
        { type = "search" },
        { type = "archives", params = { limit = 5 } },
        { type = "categories", params = { limit = 10 } },
        { type = "tag-cloud", params = { limit = 10 } },
    ]
    page = [
        { type = "search" },
        { type = "toc" },
    ]

[comments]
    enabled  = true
    provider = "giscus"

    [comments.giscus]
        repo             = "auulb/todayJob"
        repoID           = "R_kgDOVRG1UQ"
        category         = "General"
        categoryID       = "DIC_kwDOVRG1Uc4DJNCK"
        mapping          = "pathname"
        strict           = 0
        reactionsEnabled = 1
        emitMetadata     = 0
        inputPosition    = "top"
        lightTheme       = "light"
        darkTheme        = "dark_dimmed"
        lang             = "zh-CN"
        loading          = "lazy"

[cookies]
    enabled = false
